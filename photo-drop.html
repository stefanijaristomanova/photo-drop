<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Photo Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151310;
    --ink-soft:#211d18;
    --paper:#f6f1e6;
    --paper-dim:#e8e0cf;
    --amber:#e2a13d;
    --amber-dim:#a97a2c;
    --mint:#6fbfa0;
    --red:#c96450;
    --line: rgba(246,241,230,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--amber);
  }
  h1,h2,h3{
    font-family:'Space Grotesk',sans-serif;
    margin:0;
    letter-spacing:-0.01em;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:28px 20px 60px;
    min-height:100vh;
    position:relative;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:24px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 4px rgba(226,161,61,0.15);
  }
  .brand h1{font-size:19px;}

  /* filmstrip frame */
  .filmstrip{
    position:relative;
    background:var(--paper);
    border-radius:18px;
    padding:26px 22px 22px;
    color:var(--ink);
    overflow:hidden;
  }
  .filmstrip::before, .filmstrip::after{
    content:"";
    position:absolute;
    left:0;right:0;
    height:16px;
    background-image: radial-gradient(circle, var(--ink) 3.5px, transparent 3.6px);
    background-size: 22px 16px;
    background-repeat: repeat-x;
    background-position: 8px center;
  }
  .filmstrip::before{top:0;}
  .filmstrip::after{bottom:0;}
  .filmstrip-inner{ padding:14px 4px 6px; }

  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-primary{background:var(--amber);color:var(--ink);}
  .btn-primary:hover{background:#eeb459;}
  .btn-block{width:100%;}

  .intro{text-align:center;padding-bottom:2px;}
  .intro p{font-size:13px;opacity:0.65;margin:0 0 16px;line-height:1.5;}
  .intro p b{opacity:1;color:var(--amber-dim);}

  .dropzone{
    border:1.5px dashed rgba(21,19,16,0.3);
    border-radius:12px;
    padding:30px 16px;
    text-align:center;
    cursor:pointer;
  }
  .dropzone:hover{border-color:var(--amber-dim);}
  .dropzone .icon{font-size:28px;margin-bottom:6px;}
  .dropzone .sub{font-size:12px;opacity:0.6;margin-top:4px;}
  input[type=file]{display:none;}

  .thumbs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:18px;
  }
  .thumb{
    position:relative;
    aspect-ratio:1/1;
    border-radius:8px;
    overflow:hidden;
    background:var(--paper-dim);
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .badge{
    position:absolute;bottom:4px;right:4px;
    background:rgba(21,19,16,0.75);
    color:var(--paper);
    font-size:9px;
    padding:2px 6px;
    border-radius:20px;
    font-family:'JetBrains Mono',monospace;
  }

  .banner{
    border:1px solid var(--amber-dim);
    background:rgba(226,161,61,0.08);
    border-radius:10px;
    padding:12px 14px;
    font-size:12.5px;
    line-height:1.5;
    margin-bottom:20px;
  }

  footer{
    text-align:center;
    margin-top:28px;
    font-size:11px;
    opacity:0.35;
    font-family:'JetBrains Mono',monospace;
  }
</style>
</head>
<body>

<!--
  ============================================================
  BEFORE YOU DEPLOY THIS FILE: fill in the two values below.
  ============================================================
  ENDPOINT — the Apps Script web app URL from Code.gs
             (Deploy -> New deployment -> Web app -> Execute as Me,
             Access: Anyone -> copy the URL it gives you)
  FOLDER   — the Google Drive folder name uploads should land in.
             Created automatically the first time someone uploads.

  Once these are set and the file is hosted, every visitor lands
  straight on the upload screen — no settings, no sign-in.
-->
<script>
  const CONFIG = {
    ENDPOINT: 'https://script.google.com/macros/s/AKfycbwr_q6JRO_pd_F6acre9V3ykEW8MOjLfTxhGYNVPv6S0wkhmlfO3VlbgCHj4UeHvSBudQ/exec',                    // <-- paste your Apps Script /exec URL here
    FOLDER: 'Prijovci'     // <-- change if you want a different folder name
  };
</script>

<div class="wrap" id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  if(!CONFIG.ENDPOINT){
    app.innerHTML = `
      <header><div class="brand"><span class="dot"></span><h1>Photo Drop</h1></div></header>
      <div class="banner">
        This page isn't configured yet. Open the HTML file, find the <b>CONFIG</b>
        block near the top, and paste in your Apps Script web app URL
        (see Code.gs setup notes) before deploying.
      </div>
    `;
    return;
  }

  app.innerHTML = `
    <header><div class="brand"><span class="dot"></span><h1>Photo Drop</h1></div></header>
    <div class="filmstrip">
      <div class="filmstrip-inner">
        <div class="intro">
          <p>Uploading to <b>${escapeHtml(CONFIG.FOLDER)}</b></p>
        </div>
        <div class="dropzone" id="dropzone">
          <div class="icon">&#128247;</div>
          <div><b>Choose photos</b></div>
          <div class="sub">or take a new one</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple capture="environment">
        <div class="thumbs" id="thumbs"></div>
      </div>
    </div>
    <footer>NO SIGN-IN NEEDED &middot; PHOTOS GO STRAIGHT TO YOUR DRIVE</footer>
  `;

  document.getElementById('dropzone').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if(files.length === 0) return;
    for(const file of files){
      await uploadFile(file);
    }
    e.target.value = '';
  });

  function fileToBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function addThumb(id, file){
    const thumbs = document.getElementById('thumbs');
    const div = document.createElement('div');
    div.className = 'thumb';
    div.id = id;
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = '\u2026';
    div.appendChild(img);
    div.appendChild(badge);
    thumbs.prepend(div);
  }
  function markThumbDone(id){
    const el = document.getElementById(id);
    if(el) el.querySelector('.badge').textContent = '\u2713';
  }
  function markThumbError(id){
    const el = document.getElementById(id);
    if(el) el.querySelector('.badge').textContent = '!';
  }

  async function uploadFile(file){
    const thumbId = 'th_' + Math.random().toString(36).slice(2);
    addThumb(thumbId, file);

    try{
      const base64 = await fileToBase64(file);
      const body = new URLSearchParams({
        filename: file.name,
        mimeType: file.type || 'image/jpeg',
        folder: CONFIG.FOLDER,
        data: base64
      });

      const res = await fetch(CONFIG.ENDPOINT, {
        method: 'POST',
        body: body
      });

      let ok = res.ok;
      try{
        const data = await res.json();
        ok = ok && data.success;
      }catch(parseErr){
        // Response wasn't readable — the request still reached the
        // endpoint, so treat as sent rather than failed.
      }

      if(ok){
        markThumbDone(thumbId);
      } else {
        markThumbError(thumbId);
      }
    }catch(err){
      markThumbError(thumbId);
    }
  }
})();
</script>
</body>
</html>
